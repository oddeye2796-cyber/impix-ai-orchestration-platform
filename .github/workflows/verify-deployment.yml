# Smoke-tests the deployed site.
#
# Why this exists: the agent sandbox that builds this app cannot reach
# *.github.io (nor pages.dev, vercel.app, netlify.app — the whole public web is
# off its egress allowlist), so "does the live URL actually work?" could only be
# answered by a human opening a browser. GitHub's runners have no such limit, so
# the check runs here instead. Free on public repositories.
name: Verify deployment

on:
  push:
    branches: [gh-pages]
  workflow_dispatch:
  schedule:
    # Catch a silently broken site (expired Pages build, bad cache) once a day.
    - cron: '17 6 * * *'

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Wait for Pages to serve the new build
        run: sleep 45

      - name: Install Playwright
        run: npm init -y && npm i -D playwright@1 && npx playwright install --with-deps chromium

      - name: Smoke-test the live site
        env:
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: node .github/scripts/smoke.mjs
